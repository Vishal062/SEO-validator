<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a259ff"/>
      <stop offset="100%" stop-color="#6a11cb"/>
    </radialGradient>
    <linearGradient id="goggles" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6fb"/>
      <stop offset="100%" stop-color="#005bea"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f53ac"/>
      <stop offset="100%" stop-color="#647dee"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Abstract floating shapes -->
  <ellipse cx="120" cy="80" rx="40" ry="18" fill="#fff" opacity="0.12"/>
  <ellipse cx="500" cy="60" rx="30" ry="12" fill="#fff" opacity="0.10"/>
  <ellipse cx="400" cy="350" rx="60" ry="22" fill="#fff" opacity="0.10"/>
  <ellipse cx="200" cy="320" rx="25" ry="10" fill="#fff" opacity="0.13"/>
  <!-- VR Person -->
  <!-- Body -->
  <rect x="270" y="170" width="60" height="90" rx="28" fill="url(#suit)"/>
  <!-- Left Arm -->
  <rect x="230" y="200" width="50" height="18" rx="9" transform="rotate(-25 230 200)" fill="url(#arm)"/>
  <!-- Right Arm -->
  <rect x="320" y="210" width="60" height="18" rx="9" transform="rotate(20 320 210)" fill="url(#arm)"/>
  <!-- Left Leg -->
  <rect x="275" y="250" width="18" height="60" rx="9" transform="rotate(-10 275 250)" fill="#7f53ac"/>
  <!-- Right Leg -->
  <rect x="315" y="255" width="18" height="60" rx="9" transform="rotate(10 315 255)" fill="#7f53ac"/>
  <!-- Head -->
  <ellipse cx="300" cy="160" rx="28" ry="28" fill="#fff"/>
  <!-- Hair -->
  <ellipse cx="300" cy="150" rx="20" ry="12" fill="#7f53ac"/>
  <!-- VR Goggles -->
  <rect x="282" y="155" width="36" height="18" rx="8" fill="url(#goggles)" stroke="#7f53ac" stroke-width="2"/>
  <rect x="316" y="160" width="10" height="8" rx="3" fill="#b388ff"/>
  <!-- Hand Left -->
  <ellipse cx="220" cy="210" rx="10" ry="6" fill="#fff"/>
  <!-- Hand Right -->
  <ellipse cx="390" cy="225" rx="10" ry="6" fill="#fff"/>
  <!-- Abstract floating orbs -->
  <circle cx="500" cy="120" r="8" fill="#fff" opacity="0.25"/>
  <circle cx="420" cy="80" r="6" fill="#fff" opacity="0.18"/>
  <circle cx="150" cy="250" r="10" fill="#fff" opacity="0.18"/>
  <circle cx="350" cy="370" r="12" fill="#fff" opacity="0.13"/>
  <!-- Swirls -->
  <path d="M100 300 Q200 350 300 300 Q400 250 500 300" stroke="#fff" stroke-width="6" opacity="0.10" fill="none"/>
  <path d="M120 100 Q200 60 300 100 Q400 140 480 100" stroke="#fff" stroke-width="4" opacity="0.10" fill="none"/>
</svg> 